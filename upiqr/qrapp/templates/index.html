<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPI QR Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef3f8, #f9fbfd);
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            width: min(460px, 100%);
            background: #e7edf5;
            padding: 28px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(50, 78, 110, 0.18);
            text-align: center;
            border: 1px solid #c9d5e3;
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            color: #1f3554;
            display: none;
        }

        label {
            display: none;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0 14px;
            border: 1px solid #9db0c8;
            border-radius: 10px;
            box-sizing: border-box;
            background: #fdfefe;
        }

        button {
            background: #284c76;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .error {
            color: #7a1a1a;
            font-weight: bold;
            margin: 10px 0;
        }

        .name {
            margin-top: 14px;
            font-size: 18px;
            font-weight: bold;
            color: #203b5b;
        }

        .qr-box {
            margin-top: 20px;
        }

        img {
            max-width: 260px;
            border-radius: 10px;
            background: white;
            padding: 10px;
            border: 1px solid #d8e1ec;
        }

        .apps {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 14px;
            flex-wrap: wrap;
        }

        @media (max-width: 520px) {
            body {
                padding: 12px;
            }

            .card {
                padding: 20px;
            }

            .apps {
                gap: 6px;
            }

            .app-badge {
                min-width: 64px;
                padding: 7px 10px;
                font-size: 11px;
            }

            button {
                width: 100%;
            }
        }

        .app-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 74px;
            padding: 8px 12px;
            border-radius: 999px;
            background: #ffffff;
            border: 1px solid #cad7e6;
            color: #284c76;
            font-size: 12px;
            font-weight: 700;
        }

        .pay-label {
            margin-top: 18px;
            font-size: 14px;
            color: #304c6a;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="pay-label">Enter your UPI ID below to create a secure payment QR code.</div>
        <form method="post">
            {% csrf_token %}
            <label id="contact-label" for="contact">Enter your UPI ID</label>
            <input type="text" name="contact" id="contact" inputmode="text" maxlength="50" placeholder="Generate your QR code" value="{{ contact }}" required>
            <button type="submit">Generate QR</button>
        </form>

        {% if error_message %}
            <div class="error">{{ error_message }}</div>
        {% endif %}

        {% if qr %}
            <div class="qr-box">
                <img src="data:image/jpeg;base64,{{ qr }}" alt="QR Code">
                <br><br>
                <a href="data:image/jpeg;base64,{{ qr }}" download="UPI_QR.jpg">
                    <button type="button">Download QR</button>
                </a>
                <div class="pay-label">Scan with Google Pay, PhonePe, Paytm, or any QR scanner.</div>
                <div class="pay-label">Save for future use.</div>
                <div class="apps">
                    <div class="app-badge">📲 GPay</div>
                    <div class="app-badge">📲 PhonePe</div>
                    <div class="app-badge">📲 Paytm</div>
                </div>
            </div>
        {% endif %}
    </div>
</body>
</html>
